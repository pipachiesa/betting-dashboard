<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Tendencias de jugadores y equipos de la Liga Profesional argentina.">
  <title>Betting Dashboard</title>
  <style>
    :root{color-scheme:light dark;--bg:#f6f6f3;--panel:#fff;--surface:#fafaf8;--text:#1b1b1a;--muted:#747470;--border:#dfdfda;--accent:#d95155;--bar:#222;--missing:#e7e7e1;--shadow:0 12px 32px rgba(25,25,20,.06)}
    @media(prefers-color-scheme:dark){:root{--bg:#101111;--panel:#181a1a;--surface:#1d2020;--text:#f0f1ee;--muted:#a6aaa6;--border:#303434;--accent:#e27a7c;--bar:#ededeb;--missing:#303333;--shadow:0 16px 40px rgba(0,0,0,.16)}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1280px,calc(100% - 48px));margin:44px auto 64px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:26px}h1{margin:0;font-size:clamp(30px,4vw,44px);letter-spacing:-.055em;line-height:1}header p{margin:8px 0 0;color:var(--muted)}#updated{white-space:nowrap;font-size:13px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px}.modes{display:flex;gap:6px;margin-bottom:22px;align-items:center}.modes button{width:auto}.view-toggle{margin-left:auto;display:flex;gap:6px}.modes button{min-height:38px;padding:7px 13px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px 14px;margin-bottom:24px}label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.01em}.filter-control{position:relative;display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.01em}.filter-control button{text-align:left}.filter-menu{display:none;position:absolute;z-index:3;top:68px;left:0;width:min(310px,calc(100vw - 56px));padding:9px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}.filter-menu.open{display:grid;gap:2px}.filter-menu label{display:flex;align-items:center;gap:8px;padding:8px 7px;color:var(--text);font-size:14px;font-weight:400;cursor:pointer}.filter-menu input{width:auto;min-height:0;margin:0;accent-color:var(--bar)}select,input,button{width:100%;min-height:42px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;padding:8px 11px;transition:border-color .15s,background .15s}select:focus,input:focus,button:focus-visible{outline:0;border-color:#75a9df;box-shadow:0 0 0 2px rgba(117,169,223,.18)}button{cursor:pointer}button.active{background:var(--text);color:var(--panel);border-color:var(--text)}#player-field[hidden]{display:none!important}.summary{margin:0;padding:14px 0 12px;border-top:1px solid var(--border);font-size:15px}.summary strong{font-weight:700}.chart-wrap{position:relative;overflow-x:auto;padding:3px 0 4px}.chart{display:block;width:100%;min-width:700px}.grid{stroke:var(--border);stroke-width:1}.bar{fill:var(--bar)}.missing{fill:var(--missing);stroke:var(--border)}.line{stroke:var(--accent);stroke-width:2}.value{fill:var(--text);font-size:12px;font-weight:700;text-anchor:middle}.tick{fill:var(--muted);font-size:11px;text-anchor:middle}.heat-label{fill:var(--text);font-size:13px;font-weight:600}.tooltip{position:absolute;display:none;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:7px 9px;box-shadow:var(--shadow);pointer-events:none}.tooltip.show{display:block}.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;color:var(--muted);font-size:12px}.dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}.dot.valid{background:var(--bar)}.dot.missing{background:var(--missing);border:1px solid var(--border)}.error{color:var(--accent)}
    @media(max-width:860px){main{width:min(100% - 32px,1280px);margin-top:28px}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){header{align-items:start;flex-direction:column;margin-bottom:20px}#updated{white-space:normal}.panel{padding:15px}.modes{flex-wrap:wrap;margin-bottom:18px}.view-toggle{margin-left:0}.controls{grid-template-columns:1fr;gap:12px}.chart{min-width:640px}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Betting Dashboard</h1><p>Liga Profesional · tendencias partido por partido</p></div><p id="updated">Cargando datos…</p></header>
  <section class="panel">
    <div class="modes"><button id="mode-player" class="active" aria-pressed="true">Jugador</button><button id="mode-team" aria-pressed="false">Equipo</button><span class="view-toggle"><button id="view-chart" class="active">Barras</button><button id="view-heatmap">Heatmap</button></span></div>
    <div class="controls">
      <label>País<select id="country"></select></label>
      <div class="filter-control"><span>Competencias</span><button id="filters" type="button" aria-expanded="false">Filtros</button><div id="filter-menu" class="filter-menu"></div></div>
      <label>Equipo<select id="team"></select></label>
      <label id="player-field">Jugador<select id="player"></select></label>
      <label>Métrica<select id="metric"></select></label>
      <label>Localía<select id="venue"><option value="all">Todos</option><option value="home">Local</option><option value="away">Visitante</option></select></label>
      <label>Partidos<select id="window"><option value="5">Últimos 5</option><option value="10" selected>Últimos 10</option><option value="15">Últimos 15</option><option value="20">Últimos 20</option></select></label>
      <label>Línea de apuesta<input id="line" type="number" min="0.5" max="40.5" step="1" value="1.5"></label>
    </div>
    <p id="summary" class="summary"></p>
    <div class="chart-wrap"><svg id="chart" class="chart" height="430" role="img"></svg><div id="tooltip" class="tooltip"></div></div>
    <div id="legend" class="legend"><span><i class="dot valid"></i>Dato válido</span><span><i class="dot missing"></i>No jugó / sin cobertura</span><span>L = local · V = visitante</span></div>
  </section>
</main>
<script>
(function(){
  "use strict";
  let teams=[],mode="player",view="chart",activeCompetitions={};
  const $=id=>document.getElementById(id),country=$('country'),filters=$('filters'),filterMenu=$('filter-menu'),team=$('team'),player=$('player'),metric=$('metric'),venue=$('venue'),windowSize=$('window'),line=$('line'),chart=$('chart'),summary=$('summary'),tooltip=$('tooltip'),playerField=$('player-field'),legend=$('legend');
  const metricSets={player:[['sh','Remates',1.5],['so','Remates al arco',.5],['sv','Atajadas',2.5],['ca','Tarjetas recibidas',.5]],team:[['sh','Remates',11.5],['so','Remates al arco',3.5],['co','Córners',4.5],['gf','Goles',1.5],['ga','Goles recibidos',1.5],['cf','Tarjetas recibidas',2.5],['ca','Tarjetas del rival',2.5]]};
  const option=(value,text)=>{const o=document.createElement('option');o.value=value;o.textContent=text;return o};
  const selectedTeam=()=>teams[Number(team.value)||0];
  const allCompetitions={arg:[['liga-profesional','Liga Profesional'],['libertadores','Copa Libertadores'],['sudamericana','Copa Sudamericana'],['copa-argentina','Copa Argentina']],bra:[['brasileirao','Brasileirão'],['libertadores','Copa Libertadores'],['sudamericana','Copa Sudamericana'],['copa-do-brasil','Copa do Brasil']]};
  const selectedCompetitions=()=>activeCompetitions[country.value]||new Set();
  function fillCountries(){const old=country.value,countries=[...new Set(teams.map(t=>t.l||'arg'))];country.textContent='';countries.forEach(key=>country.append(option(key,key==='bra'?'Brasil':'Argentina')));if(countries.includes(old))country.value=old}
  function fillLeagues(){const items=allCompetitions[country.value]||[];if(!activeCompetitions[country.value])activeCompetitions[country.value]=new Set(items.map(([key])=>key));const selected=selectedCompetitions();filterMenu.textContent='';items.forEach(([key,name])=>{const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.value=key;box.checked=selected.has(key);box.addEventListener('change',()=>{if(box.checked)selected.add(key);else selected.delete(key);if(!selected.size){selected.add(key);box.checked=true}filters.textContent='Filtros · '+selected.size+'/'+items.length;draw()});label.append(box,document.createTextNode(name));filterMenu.append(label)});filters.textContent='Filtros · '+selected.size+'/'+items.length}
  function fillTeams(){const old=team.value;team.textContent='';const visible=teams.map((t,i)=>({t,i})).filter(x=>(x.t.l||'arg')===country.value),grouped=new Map();visible.forEach(x=>{const groupName=x.t.z||'Brasileirão';if(!grouped.has(groupName))grouped.set(groupName,[]);grouped.get(groupName).push(x)});grouped.forEach((members,name)=>{const group=document.createElement('optgroup');group.label=name;members.sort((a,b)=>a.t.n.localeCompare(b.t.n,'es')).forEach(x=>group.append(option(x.i,x.t.n)));team.append(group)});if([...team.options].some(o=>o.value===old))team.value=old}
  function fillMetrics(reset=true){const old=metric.value;metric.textContent='';metricSets[mode].forEach(m=>metric.append(option(m[0],m[1])));if(metricSets[mode].some(m=>m[0]===old))metric.value=old;if(reset)line.value=metricSets[mode].find(m=>m[0]===metric.value)[2]}
  function fillPlayers(){const t=selectedTeam(),old=player.value,positions=[['keepers','Arqueros'],['defenders','Defensores'],['midfielders','Mediocampistas'],['forwards','Delanteros']];player.textContent='';let ids=t.r.map((_,i)=>i);if(Object.keys(t.a||{}).length)ids=ids.filter(i=>t.a[t.r[i]]);if(metric.value==='sv')ids=ids.filter(i=>(t.g||[]).includes(i));const role=i=>(t.a||{})[t.r[i]]||((t.g||[]).includes(i)?'keepers':'midfielders');positions.forEach(([key,label])=>{const group=document.createElement('optgroup');group.label=label;ids.filter(i=>role(i)===key).sort((a,b)=>t.r[a].localeCompare(t.r[b],'es')).forEach(i=>group.append(option(i,t.r[i])));if(group.children.length)player.append(group)});if([...player.options].some(o=>o.value===old))player.value=old}
  function setMode(next){mode=next;playerField.hidden=next==='team';$('mode-player').classList.toggle('active',next==='player');$('mode-team').classList.toggle('active',next==='team');$('mode-player').setAttribute('aria-pressed',next==='player');$('mode-team').setAttribute('aria-pressed',next==='team');fillMetrics();if(next==='player')fillPlayers();draw()}
  function label(){return metricSets[mode].find(m=>m[0]===metric.value)[1]}
  function value(m){if(mode==='team')return m.x[{sh:0,so:1,co:2,gf:3,ga:4,cf:5,ca:6}[metric.value]];const row=m.p.find(p=>p[0]===Number(player.value));if(!row)return null;return row[{sh:1,so:2,sv:3,ca:4}[metric.value]]}
  function playerValue(m,id){const row=m.p.find(p=>p[0]===id);return row?row[{sh:1,so:2,sv:3,ca:4}[metric.value]]:null}
  function competitionMatches(){const selected=selectedCompetitions(),fallback=country.value==='bra'?'brasileirao':'liga-profesional';return selectedTeam().m.filter(m=>selected.has(m.c||fallback))}
  function matches(){const loc=venue.value,n=Number(windowSize.value);return competitionMatches().filter(m=>loc==='all'||(loc==='home'&&m.h===1)||(loc==='away'&&m.h===0)).slice(-n)}
  function date(iso){const [y,m,d]=iso.split('-').map(Number),months=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return d+' '+months[m]}
  function el(name,attrs,text){const n=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;return n}
  function heatColor(p){const a=p<.5?[111,67,69]:[177,142,73],b=p<.5?[177,142,73]:[57,132,97],q=p<.5?p*2:(p-.5)*2;return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*q)).join(',')+')'}
  function heatLines(){if(mode==='player')return metric.value==='sh'?[.5,1.5,2.5,3.5]:metric.value==='so'?[.5,1.5,2.5]:metric.value==='sv'?[1.5,2.5,3.5]:[.5,1.5];return {sh:[7.5,9.5,11.5,13.5,15.5],so:[2.5,3.5,4.5,5.5,6.5],co:[3.5,4.5,5.5,6.5],gf:[.5,1.5,2.5,3.5],ga:[.5,1.5,2.5,3.5],cf:[1.5,2.5,3.5,4.5],ca:[1.5,2.5,3.5,4.5]}[metric.value]}
  function drawHeatmap(){chart.textContent='';tooltip.classList.remove('show');const t=selectedTeam(),lines=heatLines(),n=Number(windowSize.value);let rows,subject;if(mode==='player'){const ms=matches(),ids=t.r.map((_,i)=>i).filter(i=>!Object.keys(t.a||{}).length||t.a[t.r[i]]);rows=ids.map(i=>({name:t.r[i],v:ms.map(m=>playerValue(m,i)).filter(v=>v!==null&&v!==undefined)})).filter(r=>r.v.length).sort((a,b)=>b.v.reduce((x,y)=>x+y,0)/b.v.length-a.v.reduce((x,y)=>x+y,0)/a.v.length);subject=t.n}else{const all=competitionMatches();rows=[['Todos',all],['Local',all.filter(m=>m.h===1)],['Visitante',all.filter(m=>m.h===0)]].map(([name,ms])=>({name,v:ms.slice(-n).map(m=>value(m)).filter(v=>v!==null&&v!==undefined)})).filter(r=>r.v.length);subject=t.n}const width=Math.max(820,chart.parentElement.clientWidth),labelWidth=310,cell=Math.max(98,Math.min(132,Math.floor((width-labelWidth-24)/lines.length))),left=labelWidth,top=68,rowH=42,height=Math.max(202,top+rows.length*rowH+34);chart.setAttribute('height',height);chart.setAttribute('viewBox','0 0 '+width+' '+height);chart.setAttribute('aria-label','Heatmap de '+label()+' de '+subject);summary.innerHTML='<strong>'+subject+' · '+label()+'</strong> · Porcentaje de Over por línea'+(mode==='team'?' · Todos, local y visitante':'');lines.forEach((bet,j)=>{const x=left+j*cell;chart.append(el('text',{x:x+cell/2,y:26,class:'tick'},'Over '+bet));chart.append(el('line',{x1:x+7,y1:43,x2:x+cell-7,y2:43,class:'grid'}))});if(!rows.length){chart.append(el('text',{x:width/2,y:112,class:'tick'},'Sin partidos con datos para estos filtros'));return}rows.forEach((row,i)=>{const y=top+i*rowH;chart.append(el('text',{x:22,y:y+25,class:'heat-label'},row.name));lines.forEach((bet,j)=>{const hit=row.v.filter(v=>v>bet).length/row.v.length,x=left+j*cell,rect=el('rect',{x:x+3,y,width:cell-6,height:rowH-7,rx:7,fill:heatColor(hit),stroke:'rgba(255,255,255,.09)'});rect.addEventListener('mouseenter',()=>{tooltip.textContent=row.name+' · Over '+bet+': '+Math.round(hit*100)+'% ('+row.v.filter(v=>v>bet).length+'/'+row.v.length+')';tooltip.classList.add('show');tooltip.style.left=Math.max(0,x-10)+'px';tooltip.style.top=Math.max(0,y-42)+'px'});rect.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));chart.append(rect);chart.append(el('text',{x:x+cell/2,y:y+25,class:'value'},Math.round(hit*100)+'%'))})})}
  function draw(){if(!teams.length)return;legend.hidden=view==='heatmap';if(view==='heatmap')return drawHeatmap();const t=selectedTeam(),ms=matches(),vals=ms.map(value),valid=vals.filter(v=>v!==null&&v!==undefined),bet=Number(line.value),over=valid.filter(v=>v>bet).length,under=valid.filter(v=>v<bet).length,subject=mode==='player'?t.r[Number(player.value)]:t.n;summary.innerHTML='<strong>'+subject+' · '+label()+'</strong> · Over '+bet+': '+over+'/'+valid.length+' · Under: '+under+'/'+valid.length+(valid.length<ms.length?' · '+(ms.length-valid.length)+' sin dato':'');chart.textContent='';const width=Math.max(700,chart.parentElement.clientWidth),height=430,margin={top:30,right:18,bottom:118,left:46},pw=width-margin.left-margin.right,ph=height-margin.top-margin.bottom,max=Math.max(4,Math.ceil((valid.length?Math.max(...valid):0)+1),Math.ceil(bet+1)),slot=pw/Math.max(ms.length,1),bw=Math.max(10,slot*.62),y=v=>margin.top+ph-v/max*ph;chart.setAttribute('height',height);chart.setAttribute('viewBox','0 0 '+width+' '+height);chart.setAttribute('aria-label',label()+' por partido de '+subject);for(let k=0;k<=max;k++){const gy=y(k);chart.append(el('line',{x1:margin.left,y1:gy,x2:width-margin.right,y2:gy,class:'grid'}));chart.append(el('text',{x:margin.left-11,y:gy+4,class:'tick'},k))}const ly=y(bet);chart.append(el('line',{x1:margin.left,y1:ly,x2:width-margin.right,y2:ly,class:'line'}));chart.append(el('text',{x:width-margin.right-2,y:ly-6,class:'tick','text-anchor':'end'},'Línea '+bet));ms.forEach((m,i)=>{const v=vals[i],x=margin.left+i*slot+(slot-bw)/2;if(v===null||v===undefined){chart.append(el('rect',{x,y:y(0)-8,width:bw,height:8,class:'missing'}));chart.append(el('text',{x:x+bw/2,y:y(0)-12,class:'value'},'×'))}else{const top=v===0?y(0)-3:y(v),bh=v===0?3:y(0)-top,r=el('rect',{x,y:top,width:bw,height:bh,rx:2,class:'bar'});r.addEventListener('mouseenter',()=>{tooltip.textContent=date(m.d)+' · '+(m.h?'L':'V')+' vs '+m.o+' · '+v+' '+label().toLowerCase();tooltip.classList.add('show');tooltip.style.left=Math.min(width-220,Math.max(0,x))+'px';tooltip.style.top=Math.max(0,top-48)+'px'});r.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));chart.append(r);chart.append(el('text',{x:x+bw/2,y:top-7,class:'value'},v))}const g=el('g',{transform:'translate('+(margin.left+i*slot+slot/2)+' '+(margin.top+ph+12)+') rotate(-58)'});g.append(el('text',{class:'tick','text-anchor':'end'},date(m.d)+' · '+(m.h?'L':'V')+' '+m.o));chart.append(g)})}
  country.addEventListener('change',()=>{fillLeagues();fillTeams();fillPlayers();draw()});filters.addEventListener('click',()=>{const open=filterMenu.classList.toggle('open');filters.setAttribute('aria-expanded',open)});document.addEventListener('click',event=>{if(!event.target.closest('.filter-control')){filterMenu.classList.remove('open');filters.setAttribute('aria-expanded','false')}});team.addEventListener('change',()=>{fillPlayers();draw()});player.addEventListener('change',draw);metric.addEventListener('change',()=>{line.value=metricSets[mode].find(m=>m[0]===metric.value)[2];if(mode==='player')fillPlayers();draw()});venue.addEventListener('change',draw);windowSize.addEventListener('change',draw);line.addEventListener('input',draw);$('mode-player').addEventListener('click',()=>setMode('player'));$('mode-team').addEventListener('click',()=>setMode('team'));$('view-chart').addEventListener('click',()=>{view='chart';$('view-chart').classList.add('active');$('view-heatmap').classList.remove('active');draw()});$('view-heatmap').addEventListener('click',()=>{view='heatmap';$('view-heatmap').classList.add('active');$('view-chart').classList.remove('active');draw()});let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(draw,100)});
  const dataUrl='https://raw.githubusercontent.com/pipachiesa/betting-dashboard/main/data.json?v='+Date.now();
  fetch(dataUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{teams=data.teams;fillCountries();fillLeagues();$('updated').textContent='Actualizado: '+new Date(data.generatedAt).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'});fillTeams();fillMetrics();fillPlayers();draw()}).catch(err=>{$('updated').textContent='No se pudieron cargar los datos';$('updated').className='error';summary.textContent=err.message});
})();
</script>
</body>
</html>
