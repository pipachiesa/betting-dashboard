  const predNames={shots:'Remates',sot:'Remates al arco',corners:'Córners',goals:'Goles',cards:'Tarjetas',fouls:'Faltas cometidas',tackles:'Entradas',xg:'xG'};
  const playerLines={shots:[0.5,1.5,2.5],sot:[0.5,1.5],saves:[1.5,2.5,3.5],fouls:[0.5,1.5],fouled:[0.5,1.5,2.5],tackles:[1.5,2.5,3.5],cards:[0.5]};
  const playerNames={shots:'Remates',sot:'Remates al arco',saves:'Atajadas',fouls:'Faltas cometidas',fouled:'Faltas recibidas',tackles:'Entradas',cards:'Tarjetas'};
  // which team total each player market is a share of ('opp' = the rival's)
  const playerBase={shots:['shots','own'],sot:['sot','own'],saves:['sot','opp'],fouls:['fouls','own'],fouled:['fouls','opp'],tackles:['tackles','own'],cards:['cards','own']};

  function nbTail(lam,line,r){
    lam=Math.max(1e-9,lam);const t=Math.floor(line);let total=0,term;
    if(r===null||r===undefined||r<=0){term=Math.exp(-lam);for(let k=0;k<=t;k++){if(k)term*=lam/k;total+=term}}
    else{const p=r/(r+lam);term=Math.pow(p,r);for(let k=0;k<=t;k++){if(k)term*=(r+k-1)/k*(1-p);total+=term}}
    return Math.min(1,Math.max(0,1-total));
  }
  function teamLambda(league,market,teamId,oppId,isHome){
    const m=model?.leagues?.[league]?.markets?.[market];if(!m)return null;
    const a=m.teams[teamId],d=m.teams[oppId];if(!a||!d)return null;
    return{lam:m.mu*a[0]*d[1]*(isHome?m.home:1/m.home),r:m.r,n:Math.min(a[2],d[2])};
  }
  function probCell(p,line){const wrap=document.createDocumentFragment();const tag=document.createElement('span');tag.className='thin';tag.textContent='+'+line+' ';const s=document.createElement('span');s.className='prob';s.style.background=heatColor(p);s.textContent=Math.round(p*100)+'%';wrap.append(tag,s);return wrap}
  function cell(row,content,cls){const td=document.createElement('td');if(cls)td.className=cls;if(content instanceof Node)td.append(content);else td.textContent=content;row.append(td);return td}

  function marketTable(title,note,columns,rows){
    const box=document.createElement('div'),head=document.createElement('div');
    head.className='pred-head';
    const h=document.createElement('h3');h.textContent=title;
    const n=document.createElement('span');n.className='pred-note';n.textContent=note;
    head.append(h,n);
    const scroll=document.createElement('div');scroll.className='pred-scroll';
    const table=document.createElement('table');table.className='pred';
    const thead=document.createElement('thead'),tr=document.createElement('tr');
    columns.forEach(c=>{const th=document.createElement('th');th.textContent=c;tr.append(th)});
    thead.append(tr);const tbody=document.createElement('tbody');rows.forEach(r=>tbody.append(r));
    table.append(thead,tbody);scroll.append(table);box.append(head,scroll);return box;
  }

  function fillFixtures(){
    const old=fixture.value;fixture.textContent='';
    const byId=new Map(teams.map(t=>[t.i,t]));
    fixtures=(window.__fixtures||[]).filter(f=>f.league===country.value&&byId.has(f.home)&&byId.has(f.away));
    fixtures.forEach((f,i)=>{
      const d=f.date?new Date(f.date):null;
      const when=d?d.toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'';
      fixture.append(option(i,when+' · '+byId.get(f.home).n+' vs '+byId.get(f.away).n));
    });
    if(!fixtures.length)fixture.append(option('','Sin partidos próximos'));
    if([...fixture.options].some(o=>o.value===old))fixture.value=old;
  }

  function drawPrediction(){
    predict.textContent='';
    if(!model){summary.textContent='Cargando modelo…';return}
    const f=fixtures[Number(fixture.value)||0];
    if(!f){summary.textContent='No hay partidos próximos para esta liga.';return}
    const byId=new Map(teams.map(t=>[t.i,t])),home=byId.get(f.home),away=byId.get(f.away);
    const league=f.league,meta=model.leagues?.[league];
    if(!meta){summary.innerHTML='<strong>Sin modelo para esta liga.</strong> Hace falta historial: corré <code>backfill.py</code>.';return}
    summary.innerHTML='<strong>'+home.n+' vs '+away.n+'</strong> · modelo ajustado sobre '+meta.matches+' partidos ('+meta.from+' → '+meta.to+') · las probabilidades son del modelo, no del mercado';

    // the fixture list includes cup ties against clubs from other divisions;
    // the league model has no factors for them, so say so instead of drawing
    // an empty table
    const known=m=>{const mk=meta.markets?.shots?.teams;return mk&&mk[m]};
    const missing=[home,away].filter(t=>!known(t.i));
    if(missing.length){
      predict.innerHTML='<p class="pred-note">Sin estimación para este partido: '+
        missing.map(t=>'<strong>'+t.n+'</strong>').join(' y ')+
        (missing.length>1?' no están':' no está')+
        ' en el modelo. Es un cruce de copa contra un equipo de otra división, y el histórico '+
        'solo cubre partidos de liga. Elegí un partido de liga.</p>';
      return;
    }

    // team markets, both sides
    const teamRows=[];
    Object.keys(predLines).forEach(market=>{
      [[home,away,1],[away,home,0]].forEach(([t,o,isHome])=>{
        const r=teamLambda(league,market,t.i,o.i,isHome);if(!r)return;
        const tr=document.createElement('tr');
        cell(tr,predNames[market]+' · '+t.n+(isHome?' (L)':' (V)'));
        cell(tr,r.lam.toFixed(2),'lam');
        predLines[market].forEach(line=>cell(tr,probCell(nbTail(r.lam,line,r.r),line)));
        for(let k=predLines[market].length;k<4;k++)cell(tr,'');
        cell(tr,r.n+' pj','thin');
        teamRows.push(tr);
      });
    });
    predict.append(marketTable('Mercados de equipo','λ = esperado · % = probabilidad de Over',
      ['Mercado','λ','Over','Over','Over','Over','Muestra'],teamRows));

    // player props for both squads
    [[home,away,1],[away,home,0]].forEach(([t,o,isHome])=>{
      const shares=model.players?.shares||{},profiles=model.players?.profiles||{};
      const ids=Object.keys(profiles).filter(id=>profiles[id].team===t.i&&profiles[id].min>=20&&profiles[id].n>=3);
      const rows=[];
      ids.forEach(id=>{
        const prof=profiles[id],share=shares[id]||{};
        Object.keys(playerLines).forEach(market=>{
          const s=share[market];if(s===undefined||s<=0)return;
          if(market==='saves'&&!prof.gk)return;
          if(market!=='saves'&&prof.gk)return;
          const [base,sideKey]=playerBase[market];
          const r=sideKey==='own'?teamLambda(league,base,t.i,o.i,isHome):teamLambda(league,base,o.i,t.i,!isHome);
          if(!r)return;
          const lam=r.lam*s*(prof.min/90);
          if(lam<0.12)return;
          rows.push({name:prof.name,pos:prof.pos,market,lam,n:prof.n,min:prof.min});
        });
      });
      rows.sort((a,b)=>b.lam-a.lam);
      const trs=rows.slice(0,40).map(r=>{
        const tr=document.createElement('tr');
        cell(tr,r.name+' · '+playerNames[r.market]);
        cell(tr,(r.pos||'')+' · '+Math.round(r.min)+"'",'thin');
        cell(tr,r.lam.toFixed(2),'lam');
        playerLines[r.market].forEach(line=>cell(tr,probCell(nbTail(r.lam,line,null),line)));
        for(let k=playerLines[r.market].length;k<3;k++)cell(tr,'');
        cell(tr,r.n+' pj','thin');
        return tr;
      });
      if(trs.length)predict.append(marketTable('Props de jugador · '+t.n,
        'λ ajustado por minutos esperados · Poisson',
        ['Jugador / mercado','Pos · min','λ','Over','Over','Over','Muestra'],trs));
    });
  }
  country.addEventListener('change',()=>{fillLeagues();fillTeams();fillPlayers();fillFixtures();draw()});filters.addEventListener('click',()=>{const open=filterMenu.classList.toggle('open');filters.setAttribute('aria-expanded',open)});document.addEventListener('click',event=>{if(!event.target.closest('.filter-control')){filterMenu.classList.remove('open');filters.setAttribute('aria-expanded','false')}});team.addEventListener('change',()=>{fillPlayers();draw()});player.addEventListener('change',draw);metric.addEventListener('change',()=>{line.value=metricSets[mode].find(m=>m[0]===metric.value)[2];if(mode==='player')fillPlayers();draw()});venue.addEventListener('change',draw);windowSize.addEventListener('change',draw);line.addEventListener('input',draw);heatMin.addEventListener('input',()=>{heatMinValue.textContent=heatMin.value;draw()});$('mode-player').addEventListener('click',()=>setMode('player'));$('mode-team').addEventListener('click',()=>setMode('team'));$('mode-predict').addEventListener('click',()=>setMode('predict'));fixture.addEventListener('change',draw);$('view-chart').addEventListener('click',()=>{view='chart';$('view-chart').classList.add('active');$('view-heatmap').classList.remove('active');draw()});$('view-heatmap').addEventListener('click',()=>{view='heatmap';$('view-heatmap').classList.add('active');$('view-chart').classList.remove('active');draw()});let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(draw,100)});
  const dataUrl='https://raw.githubusercontent.com/pipachiesa/betting-dashboard/main/data.json?v='+Date.now();
  fetch(dataUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{teams=data.teams;leagueMeta=Object.fromEntries((data.leagues||[]).map(item=>[item.k,item]));fillCountries();fillLeagues();$('updated').textContent='Actualizado: '+new Date(data.generatedAt).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'});window.__fixtures=data.fixtures||[];fillTeams();fillMetrics();fillPlayers();draw();
    const modelUrl='https://raw.githubusercontent.com/pipachiesa/betting-dashboard/main/model.json?v='+Date.now();
    fetch(modelUrl,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(m=>{model=m;if(mode==='predict')draw()}).catch(()=>{model=null});
  }).catch(err=>{$('updated').textContent='No se pudieron cargar los datos';$('updated').className='error';summary.textContent=err.message});
})();
</script>
</body>
